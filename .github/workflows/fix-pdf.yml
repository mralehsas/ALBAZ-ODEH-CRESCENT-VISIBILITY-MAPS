name: Repair PDF export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-pdf.yml"
      - "scripts/fix_pdf_export.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair PDF export
        run: python scripts/fix_pdf_export.py

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I)
          Path('/tmp/index-scripts.js').write_text('\n'.join(scripts), encoding='utf-8')
          print(f'Validated {len(scripts)} script blocks')
          PY
          node --check /tmp/index-scripts.js

      - name: Commit repaired page
        run: |
          if git diff --quiet -- index.html; then
            echo "No repair was required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix PDF export and JavaScript syntax"
          git push
