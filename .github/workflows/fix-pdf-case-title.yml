name: Fix PDF case title

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-pdf-case-title.py'
      - '.github/workflows/fix-pdf-case-title.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Repair PDF report title helper
        run: python .github/scripts/fix-pdf-case-title.py

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I)
          if not scripts:
              raise SystemExit('No JavaScript blocks found')
          Path('/tmp/index-scripts.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/index-scripts.js

      - name: Verify PDF title helper
        run: |
          grep -q 'function getCurrentCaseTitle' index.html
          grep -q 'escapeHTML(getCurrentCaseTitle())' index.html

      - name: Commit repaired index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No PDF title repair required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix undefined PDF report title helper'
          git push
